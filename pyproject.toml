[project]
name = "plume"
dynamic = ["version"]
description = "A fire, smoke and explosion simulator that renders flipbook sheets for realtime games, driven by text recipes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "warp-lang==1.19.0",
    "numpy>=2.1",
    "pillow>=11.0",
    "tomli-w>=1.2",
]

[project.scripts]
plume = "plume.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/plume/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/plume"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["gpu: needs a CUDA GPU; skipped when none is present"]
