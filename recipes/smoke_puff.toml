# A single soft puff of warm smoke that rises a little, billows open and fades over about two and a half
# seconds.

seed = 7

[domain]
size_m = [2.0, 2.5, 2.0]
cell_m = 0.025               # 80 x 100 x 80 cells

[time]
duration_s = 2.4
frames = 64

[[emitter]]
name = "puff"
center_m = [0.0, 0.35, 0.0]
radius_m = 0.3
edge_softness = 0.6
end_s = 0.2
smoke_per_s = 14.0
temperature_k = 318.0
velocity_mps = [0.0, 0.35, 0.0]
noise = { scale_m = 0.12, strength = 0.7 }

[forces]
vorticity_confinement = 3.0  # keeps the curls the grid would smear
drag_per_s = 0.5             # holds the turbulence's swirls to a few tenths of a meter per second
turbulence = { scale_m = 0.2, strength_mps2 = 0.12, speed_mps = 0.2 }

[dissipation]
smoke_per_s = 1.6
cooling_per_s = 1.0

[render]
opacity_per_density = 4.0
